<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200" />
    <title>ZapGram OG RU</title>
    <style>
      /* Sora has no Cyrillic — use IBM Plex for consistent RU glyphs */
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url('./fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url('./fonts/ibm-plex-sans-cyrillic-600-normal.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('./fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('./fonts/ibm-plex-sans-cyrillic-400-normal.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0a0a;
        color: #f5f5f5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: geometricPrecision;
      }

      .card {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 72px 56px;
        text-align: center;
        background: #0a0a0a;
      }

      .mark {
        width: 80px;
        height: 80px;
        margin-bottom: 32px;
        flex-shrink: 0;
        background: #0a0a0a;
      }

      .mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      h1 {
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-weight: 600;
        font-size: 48px;
        line-height: 1.14;
        letter-spacing: -0.025em;
        max-width: 22ch;
        color: #f5f5f5;
      }

      p {
        margin-top: 24px;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-weight: 400;
        font-size: 22px;
        line-height: 1.55;
        color: #9a9a9a;
        max-width: 36rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <img src="./logo.svg" alt="Логотип ZapGram" width="80" height="80" />
      </div>
      <h1>Bitcoin Lightning-кошелёк в Telegram</h1>
      <p>
        Отправляйте, получайте, оставляйте tips и монетизируйте чаты в сатоши — не выходя из
        Telegram.
      </p>
    </div>
  </body>
</html>
