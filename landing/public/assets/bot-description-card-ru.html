<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=960" />
    <title>ZapGram · bot description RU</title>
    <style>
      /* Sora has no Cyrillic — IBM Plex for consistent RU glyphs */
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url('./fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url('./fonts/ibm-plex-sans-cyrillic-600-normal.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('./fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('./fonts/ibm-plex-mono-cyrillic-400-normal.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 960px;
        height: 540px;
        overflow: hidden;
        background: #0a0a0a;
        color: #f5f5f5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: geometricPrecision;
      }

      .card {
        width: 960px;
        height: 540px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 28px 32px;
        text-align: center;
        background: #0a0a0a;
      }

      .mark {
        width: 56px;
        height: 56px;
        margin-bottom: 16px;
        flex-shrink: 0;
        background: #0a0a0a;
      }

      .mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      h1 {
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-weight: 600;
        font-size: 50px;
        line-height: 1.1;
        letter-spacing: -0.025em;
        max-width: 16ch;
        color: #f5f5f5;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 32px;
        max-width: 900px;
      }

      .chip {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 22px;
        line-height: 1;
        letter-spacing: 0.02em;
        color: #f5f5f5;
        background: #161616;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        padding: 18px 22px;
        white-space: nowrap;
      }

      .chip em {
        font-style: normal;
        color: #f7931a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <img src="./logo.svg" alt="" width="56" height="56" />
      </div>
      <h1>Bitcoin Lightning-кошелёк</h1>
      <div class="chips" aria-hidden="true">
        <span class="chip">tips <em>/tip</em></span>
        <span class="chip">инвойсы + QR</span>
        <span class="chip">платные чаты · LN + on-chain</span>
        <span class="chip">внешний кошелёк</span>
      </div>
    </div>
  </body>
</html>
