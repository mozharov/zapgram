<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=640" />
    <title>ZapGram · bot description EN</title>
    <style>
      @font-face {
        font-family: 'Sora';
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url('./fonts/sora-latin-600-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('./fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('./fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 640px;
        height: 360px;
        overflow: hidden;
        background: #0a0a0a;
        color: #f5f5f5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: geometricPrecision;
      }

      .card {
        width: 640px;
        height: 360px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 36px 30px;
        text-align: center;
        background: #0a0a0a;
      }

      .mark {
        width: 48px;
        height: 48px;
        margin-bottom: 12px;
        flex-shrink: 0;
        background: #0a0a0a;
      }

      .mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      .brand {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-weight: 400;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9a9a9a;
        margin-bottom: 10px;
      }

      h1 {
        font-family: 'Sora', system-ui, sans-serif;
        font-weight: 600;
        font-size: 26px;
        line-height: 1.15;
        letter-spacing: -0.03em;
        max-width: 18ch;
        color: #f5f5f5;
      }

      p {
        margin-top: 12px;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-weight: 400;
        font-size: 14px;
        line-height: 1.45;
        color: #9a9a9a;
        max-width: 28rem;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        margin-top: 20px;
        max-width: 580px;
      }

      .chip {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 11px;
        line-height: 1;
        letter-spacing: 0.02em;
        color: #f5f5f5;
        background: #161616;
        border: 1px solid #2a2a2a;
        border-radius: 5px;
        padding: 7px 10px;
        white-space: nowrap;
      }

      .chip em {
        font-style: normal;
        color: #f7931a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <img src="./logo.svg" alt="" width="48" height="48" />
      </div>
      <div class="brand">ZapGram</div>
      <h1>Bitcoin Lightning wallet inside Telegram</h1>
      <p>Send, receive, tip, and monetize chats with sats.</p>
      <div class="chips" aria-hidden="true">
        <span class="chip">tips <em>/tip</em></span>
        <span class="chip">invoices + QR</span>
        <span class="chip">paid chats · LN + on-chain</span>
        <span class="chip">external wallet</span>
      </div>
    </div>
  </body>
</html>
