<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=960" />
    <title>ZapGram · bot description EN</title>
    <style>
      @font-face {
        font-family: 'Sora';
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url('./fonts/sora-latin-600-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('./fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 960px;
        height: 540px;
        overflow: hidden;
        background: #0a0a0a;
        color: #f5f5f5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: geometricPrecision;
      }

      .card {
        width: 960px;
        height: 540px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 32px 32px;
        text-align: center;
        background: #0a0a0a;
      }

      .mark {
        width: 56px;
        height: 56px;
        margin-bottom: 16px;
        flex-shrink: 0;
        background: #0a0a0a;
      }

      .mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      h1 {
        font-family: 'Sora', system-ui, sans-serif;
        font-weight: 600;
        font-size: 54px;
        line-height: 1.08;
        letter-spacing: -0.03em;
        max-width: 14ch;
        color: #f5f5f5;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 32px;
        max-width: 900px;
      }

      .chip {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 22px;
        line-height: 1;
        letter-spacing: 0.02em;
        color: #f5f5f5;
        background: #161616;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        padding: 18px 22px;
        white-space: nowrap;
      }

      .chip em {
        font-style: normal;
        color: #f7931a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <img src="./logo.svg" alt="" width="56" height="56" />
      </div>
      <h1>Bitcoin Lightning wallet</h1>
      <div class="chips" aria-hidden="true">
        <span class="chip">tips <em>/tip</em></span>
        <span class="chip">invoices + QR</span>
        <span class="chip">paid chats · LN + on-chain</span>
        <span class="chip">external wallet</span>
      </div>
    </div>
  </body>
</html>
