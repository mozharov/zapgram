server {
    listen 80;
    listen [::]:80;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/ld+json
        application/manifest+json
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Canonical RU prefix
    location = /ru {
        return 301 /ru/;
    }

    # Locale-aware 404: /ru/* → Russian page, everything else → English
    location /ru/ {
        error_page 404 /ru/404.html;
        try_files $uri $uri/ =404;
    }

    location / {
        error_page 404 /404.html;
        try_files $uri $uri/ =404;
    }

    # Static assets (fonts, OG image, logos, CSS)
    location ~* \.(?:css|svg|woff2|jpg|jpeg|png|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    location = /ru/404.html {
        internal;
    }
}
