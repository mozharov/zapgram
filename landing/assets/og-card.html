<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200" />
    <title>ZapGram OG</title>
    <style>
      @font-face {
        font-family: 'Sora';
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url('./fonts/sora-latin-600-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('./fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0a0a;
        color: #f5f5f5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: geometricPrecision;
      }

      .card {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 80px 56px;
        text-align: center;
        background: #0a0a0a;
      }

      .mark {
        width: 80px;
        height: 80px;
        margin-bottom: 32px;
        flex-shrink: 0;
        /* same ground as card so logo.svg black plate disappears */
        background: #0a0a0a;
      }

      .mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      h1 {
        font-family: 'Sora', system-ui, sans-serif;
        font-weight: 600;
        font-size: 56px;
        line-height: 1.12;
        letter-spacing: -0.03em;
        max-width: 16.5ch;
        color: #f5f5f5;
      }

      p {
        margin-top: 24px;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-weight: 400;
        font-size: 22px;
        line-height: 1.55;
        color: #9a9a9a;
        max-width: 36rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <img src="./logo.svg" alt="" width="80" height="80" />
      </div>
      <h1>Bitcoin Lightning wallet inside Telegram</h1>
      <p>
        Send, receive, tip, and monetize chats with sats — without leaving
        Telegram.
      </p>
    </div>
  </body>
</html>
